<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Масова частка розчиненої речовини</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
        body { font-family: 'Montserrat', sans-serif; background: #050b1a; color: #ffffff; }
        .glow-box { box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
        .glow-option:hover { box-shadow: 0 0 15px rgba(234, 179, 8, 0.6); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-950 via-slate-900 to-black">

    <!-- СТАРТОВИЙ ЕКРАН (ТОЧНО ЯК НА ВАШОМУ ФОТО) -->
    <div id="start-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-cover bg-center p-4" style="background: linear-gradient(rgba(5,11,26,0.5), rgba(5,11,26,0.8)), url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1920&q=80')">
        <div class="max-w-3xl w-full bg-slate-900/85 backdrop-blur-md p-8 md:p-12 rounded-3xl border border-blue-500/30 text-center glow-box relative overflow-hidden">
            <div class="absolute left-4 bottom-0 w-36 md:w-48 opacity-90 hidden sm:block">
                <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80" alt="Ведуча" class="w-full h-auto object-cover rounded-t-2xl">
            </div>
            <div class="sm:ml-32">
                <h1 class="text-3xl md:text-5xl font-extrabold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 leading-tight">
                    Масова частка розчиненої речовини
                </h1>
                <p class="text-slate-200 text-lg md:text-xl mb-8 font-medium">Перевір свої знання: 12 запитань</p>
                <button onclick="startGame()" class="px-8 py-4 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-extrabold text-xl rounded-2xl shadow-lg transition transform hover:scale-105">
                    Start the challenge 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- ОСНОВНИЙ ІГРОВИЙ ІНТЕРФЕЙС -->
    <div id="game-screen" class="hidden flex-1 flex flex-col justify-between p-4 md:p-6 max-w-5xl mx-auto w-full">
        
        <!-- ВЕРХНЯ ПАНЕЛЬ -->
        <header class="flex flex-wrap justify-between items-center gap-4 bg-slate-900/70 backdrop-blur border border-blue-500/20 px-6 py-4 rounded-2xl">
            <div class="flex items-center gap-3">
                <span id="level-badge" class="px-4 py-1.5 bg-blue-600/30 border border-blue-400/40 text-blue-300 rounded-xl font-bold text-base">
                    Level 1 of 12
                </span>
                <span id="host-dialogue" class="text-slate-300 text-base italic hidden md:inline">Let's start easy.</span>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-4 py-1.5 rounded-xl">
                    <span class="text-amber-400 text-xl">⭐</span>
                    <span class="text-slate-300 text-sm font-semibold">Зірки:</span>
                    <span id="current-prize" class="text-amber-400 font-extrabold text-xl">0</span>
                </div>
                <div class="flex items-center gap-2 bg-slate-800/80 border border-slate-700 px-4 py-1.5 rounded-xl">
                    <span class="text-blue-400 font-mono text-xl font-bold" id="timer">00:30</span>
                </div>
            </div>
        </header>

        <!-- ЦЕНТРАЛЬНА ЧАСТИНА: ЗАПИТАННЯ ТА ВАРІАНТИ -->
        <main class="my-auto py-6 flex flex-col gap-6">
            <!-- Картка запитання (Крупний текст) -->
            <div class="bg-gradient-to-r from-blue-950/90 to-slate-900/90 border border-blue-500/40 p-6 md:p-10 rounded-3xl shadow-2xl relative text-center">
                <div class="absolute -top-4 left-8 bg-blue-600 text-white text-xs font-bold px-4 py-1 rounded-full uppercase tracking-wider">
                    Запитання
                </div>
                <h2 id="question-text" class="text-2xl md:text-3xl font-extrabold leading-relaxed text-white mt-2">
                    Завантаження запитання...
                </h2>
            </div>

            <!-- Варіанти відповідей (Дуже крупні кнопки) -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Заповнюється через JS -->
            </div>
        </main>

        <!-- НИЖНЯ ПАНЕЛЬ: ПІДКАЗКИ ТА ВИХІД -->
        <footer class="flex flex-wrap justify-between items-center gap-4 bg-slate-900/70 backdrop-blur border border-blue-500/20 px-6 py-4 rounded-2xl">
            <button onclick="walkAway()" class="px-5 py-2.5 bg-rose-600/20 border border-rose-500/40 hover:bg-rose-600/30 text-rose-300 font-semibold rounded-xl transition">
                🚪 Забрати зірки
            </button>
            
            <div class="flex items-center gap-3">
                <button onclick="useFiftyFifty()" id="lifeline-50" class="px-4 py-2 bg-blue-600/20 border border-blue-400/40 hover:bg-blue-600/40 text-blue-300 font-semibold rounded-xl transition">
                    ✂️ 50:50
                </button>
                <button onclick="useClue()" id="lifeline-clue" class="px-4 py-2 bg-blue-600/20 border border-blue-400/40 hover:bg-blue-600/40 text-blue-300 font-semibold rounded-xl transition">
                    💡 Підказка
                </button>
                <button onclick="useSecondChance()" id="lifeline-second" class="px-4 py-2 bg-blue-600/20 border border-blue-400/40 hover:bg-blue-600/40 text-blue-300 font-semibold rounded-xl transition">
                    🔄 2-й шанс
                </button>
            </div>
        </footer>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО ПОВІДОМЛЕНЬ ТА ПРОДОВЖЕННЯ ГРИ -->
    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-blue-500/40 max-w-lg w-full p-8 rounded-3xl text-center glow-box">
            <h3 id="modal-title" class="text-3xl font-bold mb-4 text-amber-400">Повідомлення</h3>
            <p id="modal-text" class="text-slate-200 text-lg mb-8 leading-relaxed">Текст пояснення...</p>
            <button onclick="closeModal()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg rounded-xl transition">
                Продовжити гру ▶
            </button>
        </div>
    </div>

    <script>
        const questions = [
            {
                level: 1, title: "Level 1 of 12 · Теорія", prize: 10,
                host: "Let's start easy.",
                question: "Що таке масова частка розчиненої речовини?",
                options: [
                    "А) Відношення об'єму речовини до об'єму розчину",
                    "Б) Відношення маси розчиненої речовини до маси розчину",
                    "В) Відношення маси розчиненої речовини до маси води",
                    "Г) Добуток маси розчиненої речовини на масу розчину"
                ],
                correct: 1,
                clue: "Масова частка дорівнює масі розчиненої речовини, поділеній на загальну масу розчину."
            },
            {
                level: 2, title: "Level 2 of 12 · Хімія", prize: 20,
                host: "On to level 2.",
                question: "У яких одиницях найчастіше виражають масову частку?",
                options: [
                    "А) У молях на літр",
                    "Б) У частках від одиниці або відсотках",
                    "В) У мілілітрах",
                    "Г) У грамах або кілограмах"
                ],
                correct: 1,
                clue: "Масова частка є безрозмірною величиною і виражається у вигляді десяткового дробу або відсотків (%)"
            },
            {
                level: 3, title: "Level 3 of 12 · Задачі", prize: 30,
                host: "Keep going!",
                question: "Обчисліть масу розчину, якщо він складається з 10 г солі та 90 г води.",
                options: ["А) 100 г", "Б) 80 г", "В) 110 г", "Г) 90 г"],
                correct: 0,
                clue: "Маса розчину дорівнює сумі маси розчиненої речовини та розчинника: 10 + 90 = 100 г."
            },
            {
                level: 4, title: "Level 4 of 12 · Задачі", prize: 40,
                host: "First safe checkpoint!",
                question: "Яка масова частка солі в розчині, де 20 г солі розчинено у 180 г води?",
                options: ["А) 10%", "Б) 5%", "В) 11.1%", "Г) 20%"],
                correct: 0,
                clue: "Маса розчину = 20 + 180 = 200 г. Частка = 20 / 200 = 0.1 або 10%."
            },
            {
                level: 5, title: "Level 5 of 12 · Теорія", prize: 50,
                host: "Moving up!",
                question: "Як зміниться масова частка речовини, якщо до розчину додати води?",
                options: ["А) Збільшиться", "Б) Зменшиться", "В) Не зміниться", "Г) Спочатку збільшиться, потім зменшиться"],
                correct: 1,
                clue: "При додаванні розчинника (води) кількість речовини не змінюється, а загальна маса розчину зростає, тому частка зменшується."
            },
            {
                level: 6, title: "Level 6 of 12 · Задачі", prize: 60,
                host: "Great job so far!",
                question: "Скільки солі потрібно взяти для приготування 200 г розчину з масовою часткою 5%?",
                options: ["А) 100 г", "Б) 20 г", "В) 10 г", "Г) 5 г"],
                correct: 2,
                clue: "Масу речовини знаходять множенням маси розчину на частку: 200 * 0.05 = 10 г."
            },
            {
                level: 7, title: "Level 7 of 12 · Хімія", prize: 70,
                host: "On to level 7.",
                question: "Як називають розчин, у якому масова частка речовини є максимально можливою за даної температури?",
                options: ["А) Концентрований", "Б) Насичений", "В) Пересичений", "Г) Розбавлений"],
                correct: 1,
                clue: "Насичений розчин — це розчин, у якому речовина за даних умов більше не розчиняється."
            },
            {
                level: 8, title: "Level 8 of 12 · Задачі", prize: 80,
                host: "Almost there!",
                question: "До 150 г розчину з масовою часткою 10% додали 50 г води. Яка нова масова частка?",
                options: ["А) 8%", "Б) 5%", "В) 10%", "Г) 7.5%"],
                correct: 3,
                clue: "Маса чистої речовини = 150 * 0.1 = 15 г. Нова маса розчину = 150 + 50 = 200 г. Нова частка = 15 / 200 = 0.075 або 7.5%."
            },
            {
                level: 9, title: "Level 9 of 12 · Хімія", prize: 90,
                host: "Challenging question!",
                question: "Фізіологічний розчин — це розчин кухонної солі з масовою часткою:",
                options: ["А) 9%", "Б) 0.9%", "В) 5%", "Г) 0.1%"],
                correct: 1,
                clue: "Фізіологічний розчин (0.9% розчин NaCl) є ізотонічним до плазми крові людини."
            },
            {
                level: 10, title: "Level 10 of 12 · Задачі", prize: 100,
                host: "Level 10!",
                question: "У 300 г розчину міститься 60 г цукру. Яка масова частка цукру?",
                options: ["А) 25%", "Б) 10%", "В) 15%", "Г) 20%"],
                correct: 3,
                clue: "60 г поділити на 300 г дорівнює 0.2, тобто 20%."
            },
            {
                level: 11, title: "Level 11 of 12 · Хімія", prize: 120,
                host: "Penultimate!",
                question: "Яка формула використовується для обчислення маси розчину за густиною та об'ємом?",
                options: ["А) m = V / ρ", "Б) m = V + ρ", "В) m = V * ρ", "Г) m = ρ / V"],
                correct: 2,
                clue: "Маса дорівнює добутку об'єму на густину (m = ρV)."
            },
            {
                level: 12, title: "Level 12 of 12 · Задачі", prize: 150,
                host: "The final challenge!",
                question: "Яку масу цукру треба додати до 100 г розчину з часткою 10%, щоб вона стала 20%?",
                options: ["А) 20 г", "Б) 10 г", "В) 15 г", "Г) 12.5 г"],
                correct: 3,
                clue: "Початкова маса цукру = 10 г, води = 90 г. Нехай додано x г цукру. (10 + x) / (100 + x) = 0.2 => x = 12.5 г."
            }
        ];

        let currentLevel = 0;
        let score = 0;
        let timerSeconds = 30;
        let timerInterval = null;
        let secondChanceActive = false;
        let pendingNextAction = null;

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.setValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {}
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentLevel >= questions.length) {
                endGame(true);
                return;
            }

            const q = questions[currentLevel];
            document.getElementById('level-badge').innerText = q.title;
            document.getElementById('host-dialogue').innerText = q.host;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('current-prize').innerText = score;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            secondChanceActive = false;

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "glow-option text-left p-5 rounded-2xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 font-bold text-lg md:text-xl text-white transition flex items-center gap-4 group";
                btn.id = `option-${idx}`;
                btn.onclick = () => selectOption(idx);
                
                const letter = ['А', 'Б', 'В', 'Г'][idx];
                btn.innerHTML = `
                    <span class="w-10 h-10 rounded-xl bg-blue-600/30 border border-blue-400/40 flex items-center justify-center font-extrabold text-blue-300 text-lg shrink-0 group-hover:bg-blue-600 group-hover:text-white transition">${letter}</span>
                    <span class="flex-1 leading-snug">${opt.substring(3)}</span>
                `;
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 30;
            document.getElementById('timer').innerText = "00:30";
            
            timerInterval = setInterval(() => {
                timerSeconds--;
                let secStr = timerSeconds < 10 ? '0' + timerSeconds : timerSeconds;
                document.getElementById('timer').innerText = `00:${secStr}`;
                
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    playSound('wrong');
                    showModal("Час вийшов!", "Час на роздуми сплив. Переходимо до наступного запитання!", () => {
                        currentLevel++;
                        loadQuestion();
                    });
                }
            }, 1000);
        }

        function selectOption(selectedIdx) {
            clearInterval(timerInterval);
            const q = questions[currentLevel];
            const btn = document.getElementById(`option-${selectedIdx}`);

            if (selectedIdx === q.correct) {
                playSound('correct');
                btn.classList.remove('bg-slate-800/90');
                btn.classList.add('bg-emerald-600', 'border-emerald-400');
                score = q.prize;
                document.getElementById('current-prize').innerText = score;

                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel >= questions.length) {
                        endGame(true);
                    } else {
                        loadQuestion();
                    }
                }, 1000);
            } else {
                if (secondChanceActive) {
                    secondChanceActive = false;
                    btn.classList.add('opacity-40', 'pointer-events-none');
                    showModal("Другий шанс!", "Це хибна відповідь, але у вас є ще одна спроба!", null);
                    return;
                }

                playSound('wrong');
                btn.classList.remove('bg-slate-800/90');
                btn.classList.add('bg-rose-600', 'border-rose-400');
                
                const correctBtn = document.getElementById(`option-${q.correct}`);
                correctBtn.classList.remove('bg-slate-800/90');
                correctBtn.classList.add('bg-emerald-600', 'border-emerald-400');

                showModal("Неправильна відповідь", `На жаль, це помилка. Правильна відповідь: ${q.options[q.correct].substring(3)}.\n\nПояснення: ${q.clue}`, () => {
                    currentLevel++;
                    loadQuestion();
                });
            }
        }

        function useFiftyFifty() {
            const q = questions[currentLevel];
            let hiddenCount = 0;
            q.options.forEach((_, idx) => {
                if (idx !== q.correct && hiddenCount < 2) {
                    const btn = document.getElementById(`option-${idx}`);
                    btn.classList.add('opacity-30', 'pointer-events-none');
                    hiddenCount++;
                }
            });
            event.target.closest('button').disabled = true;
            event.target.closest('button').classList.add('opacity-40');
        }

        function useClue() {
            const q = questions[currentLevel];
            showModal("💡 Підказка ведучої", q.clue, null);
            event.target.closest('button').disabled = true;
            event.target.closest('button').classList.add('opacity-40');
        }

        function useSecondChance() {
            secondChanceActive = true;
            showModal("🔄 Другий шанс", "У разі помилки ви зможете зробити ще одну спробу на цьому запитанні.", null);
            event.target.closest('button').disabled = true;
            event.target.closest('button').classList.add('opacity-40');
        }

        function walkAway() {
            clearInterval(timerInterval);
            showModal("Гра завершена", `Ви забрали свої зірки: ⭐ ${score}. Чудовий результат!`, () => location.reload());
        }

        function endGame(won) {
            clearInterval(timerInterval);
            showModal(
                won ? "🎉 Вітаємо! Всі питання пройдено!" : "Гру закінчено",
                won ? `Ви пройшли всі 12 запитань і заробили максимальну кількість зірок: ⭐ ${score}!` : `Вікторину завершено! Ваш фінальний результат: ⭐ ${score} зірок.`,
                () => location.reload()
            );
        }

        function showModal(title, text, action) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal').classList.remove('hidden');
            pendingNextAction = action;
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            if (typeof pendingNextAction === 'function') {
                const action = pendingNextAction;
                pendingNextAction = null;
                action();
            }
        }
    </script>
</body>
</html>
